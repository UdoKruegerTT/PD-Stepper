; PD Stepper Web Server — PlatformIO project
;
; Two build environments:
;   esp32-s3      → USB flashing via esptool (default, use once for initial flash)
;   esp32-s3-ota  → Wireless flashing via ArduinoOTA / espota
;                    PC must be connected to the "PD Stepper" WiFi AP.
;
; Commands:
;   pio run -t upload                       (USB, uses default env)
;   pio run -e esp32-s3-ota -t upload       (wireless, no cable needed)

[platformio]
default_envs = esp32-s3
src_dir = src

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    https://github.com/ESP32Async/AsyncTCP.git
    janelia-arduino/TMC2209

[env:esp32-s3]
; USB upload via esptool

[env:esp32-s3-ota]
upload_protocol = espota
upload_port = 192.168.4.1
